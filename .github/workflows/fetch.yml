name: fetch

on:
  workflow_dispatch:
    inputs:
      device:
        description: product type, e.g. iPhone14,5
        required: true
        default: iPhone14,5
        type: string
      build:
        description: iOS build, e.g. 24A437
        required: true
        default: 24A437
        type: string

permissions:
  contents: read

concurrency:
  group: fetch-${{ inputs.device }}-${{ inputs.build }}
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    steps:
      - name: cache key
        id: key
        run: echo "key=ipsw-${DEV//,/_}-${BUILD}" >> "$GITHUB_OUTPUT"
        env:
          DEV: ${{ inputs.device }}
          BUILD: ${{ inputs.build }}

      - id: cache
        uses: actions/cache@v5
        with:
          path: ipsw-cache
          key: ${{ steps.key.outputs.key }}

      - if: steps.cache.outputs.cache-hit != 'true'
        name: ipsw
        run: |
          set -euo pipefail
          url=$(curl -fsSL -H "authorization: Bearer ${{ github.token }}" \
            https://api.github.com/repos/blacktop/ipsw/releases/latest \
            | jq -r '[.assets[] | select(.name | startswith("ipsw_")) | select(.name | contains("_linux_x86_64")) | select(.name | endswith(".deb")) | .browser_download_url][0]')
          [ -n "$url" ] || { echo "no matching release asset"; exit 1; }
          echo "$url"
          curl -fsSL "$url" -o ipsw.deb
          sudo apt-get install -y ./ipsw.deb
          ipsw version

      - if: steps.cache.outputs.cache-hit != 'true'
        name: download
        run: |
          set -euo pipefail
          mkdir -p ipsw-cache
          ipsw download ipsw \
            --device "${{ inputs.device }}" \
            --build "${{ inputs.build }}" \
            --confirm \
            --enable-node-selection \
            --output ipsw-cache \
            --verbose
          ls -l ipsw-cache